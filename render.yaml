# render.yaml — TorqPro AI Customer Demo (v3.4.0)
#
# Creates an ISOLATED demo service separate from the existing
# production/demo service. Deploy via:
#   Render Dashboard → New → Web Service → Connect repository →
#   select branch demo/render-v2-customer → Render detects this file.
#
# Before first deploy, set the following in the Render Dashboard
# under Environment → Secret Files / Env Vars:
#   TORQPRO_DEMO_USERNAME   (e.g. "demo")
#   TORQPRO_DEMO_PASSWORD   (strong random password, never commit)
#
# TORQPRO_SECRET_KEY is auto-generated by Render (generateValue: true).
# TORQPRO_ALLOWED_HOSTS must match the deployed service URL below.
#
# AI providers are disabled: engineering calculations are fully
# deterministic and unaffected by AI provider availability.

services:
  - type: web
    name: torqpro-ai-demo-v2
    env: docker
    dockerContext: .
    dockerfilePath: ./Dockerfile
    plan: starter
    numInstances: 1
    healthCheckPath: /api/health
    envVars:
      # Runtime mode: hides /docs and /redoc, enables HSTS
      - key: TORQPRO_ENV
        value: production

      # Database path inside the container (persistent disk below)
      - key: TORQPRO_DB_PATH
        value: /app/runtime/torqpro.db

      # Host policy — must match the deployed service subdomain
      # Update if you rename the service in Render
      - key: TORQPRO_ALLOWED_HOSTS
        value: torqpro-ai-demo-v2.onrender.com

      # Demo user provisioning at first startup (engineer role only)
      - key: TORQPRO_DEMO_USER_ENABLED
        value: "true"
      - key: TORQPRO_DEMO_ROLE
        value: engineer

      # AI providers: keep disabled for the demo
      # Set TORQPRO_ANTHROPIC_ENABLED=true and provide
      # TORQPRO_ANTHROPIC_API_KEY (as a secret) only if AI features
      # are required for a specific demo session.
      - key: TORQPRO_ANTHROPIC_ENABLED
        value: "false"
      - key: TORQPRO_OLLAMA_ENABLED
        value: "false"

      # Public-facing rate limit: 200 requests per 60 seconds per token
      - key: TORQPRO_API_RATE_LIMIT
        value: "200/60"

      # Auto-generated secret — Render creates and stores this value;
      # it is never written to source control.
      - key: TORQPRO_SECRET_KEY
        generateValue: true

      # Demo credentials — set manually in the Render Dashboard.
      # sync: false means this file never writes or overwrites them.
      - key: TORQPRO_DEMO_USERNAME
        sync: false
      - key: TORQPRO_DEMO_PASSWORD
        sync: false

    # Persistent disk so the SQLite database survives redeploys.
    # Requires a paid Render plan (starter or above).
    # Remove this section to use ephemeral storage (data resets on redeploy;
    # demo user is re-provisioned automatically on each startup via
    # TORQPRO_DEMO_USER_ENABLED, so ephemeral storage is acceptable for demos).
    disk:
      name: torqpro-demo-data
      mountPath: /app/runtime
      sizeGB: 1
